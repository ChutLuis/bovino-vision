[pytest]
testpaths = tests
python_files = test_*.py
# test_pipeline_smoke.py es un script E2E que necesita /tmp/test_cow.jpg y la cámara; se corre a mano.
addopts = -p no:cacheprovider --ignore=tests/test_pipeline_smoke.py
markers =
    slow: pruebas que cargan modelos o exportan (segundos a minutos)
